<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>포켓몬 도감 | 1세대</title>
<style>
:root{--yellow:#ffcb05;--blue:#2a75bb;--dark:#17324d;--red:#ef5350;--paper:#fffdf5;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#dff3ff,#fff9cf);color:var(--dark);min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:3px solid var(--yellow)}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;color:var(--blue)}.logo span{color:var(--red)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;transition:.18s;box-shadow:0 4px 0 rgba(0,0,0,.14)}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn-primary{background:var(--blue);color:#fff}.btn-yellow{background:var(--yellow);color:#3d2d00}.btn-red{background:var(--red);color:#fff}.btn-ghost{background:#fff;color:var(--dark);border:1px solid #d7dde5}
main{max-width:1250px;margin:0 auto;padding:28px 20px 50px}.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.85fr);gap:24px;align-items:stretch}
.panel{background:rgba(255,255,255,.94);border:2px solid #dce7ef;border-radius:26px;box-shadow:0 18px 45px rgba(42,117,187,.15)}
.slider{padding:22px;min-height:520px;position:relative;overflow:hidden}.slide-stage{height:370px;display:flex;align-items:center;justify-content:center;position:relative}.poke-card{width:min(430px,82vw);height:330px;border-radius:26px;background:linear-gradient(145deg,#fff,#f2f7fb);border:4px solid var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.12);animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateX(45px) scale(.96)}to{opacity:1;transform:none}}
.poke-card img{width:230px;height:230px;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(0,0,0,.18))}.dexno{position:absolute;left:18px;top:15px;background:var(--dark);color:#fff;border-radius:999px;padding:7px 11px;font-weight:800}.poke-name{font-size:30px;font-weight:900;margin-top:-6px}.slide-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:22px;cursor:pointer}.prev{left:18px}.next{right:18px}
.progress{height:8px;background:#e8edf3;border-radius:999px;overflow:hidden;margin:6px auto 14px;max-width:460px}.progress>div{height:100%;background:var(--blue);width:0}.meta{text-align:center;color:var(--muted);font-size:14px}.crudbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.market{padding:22px;display:flex;flex-direction:column;min-height:520px}.market h2{margin:0 0 6px}.market-sub{font-size:13px;color:var(--muted);margin-bottom:16px}.market-card{flex:1;border-radius:20px;background:#f8fbff;border:1px solid #dbe9f4;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}.market-card img{max-width:220px;max-height:305px;border-radius:14px;box-shadow:0 12px 24px rgba(0,0,0,.18)}.price{font-size:28px;font-weight:900;margin:14px 0 4px;color:#0b7a43}.small{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}.status{font-size:13px;font-weight:700;color:var(--blue);margin-top:8px}
#editor{margin-top:24px;padding:22px;display:none}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:800}.field input,.field textarea{padding:11px 12px;border:1px solid #cfd8e3;border-radius:10px;font:inherit}.field textarea{min-height:86px;resize:vertical}.full{grid-column:1/-1}.editor-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17324d;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;z-index:99}
@media(max-width:880px){.hero{grid-template-columns:1fr}.market{min-height:auto}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:14px 16px}}
</style>
</head>
<body>
<header>
  <div class="logo">POKÉ<span>DEX</span> · KANTO 151</div>
  <button class="btn btn-primary" onclick="location.href='pokemon_detail.html'">포켓몬 상세</button>
</header>
<main>
  <section class="hero">
    <div class="panel slider">
      <div class="slide-stage">
        <button class="slide-nav prev" aria-label="이전">‹</button>
        <div id="pokeCard" class="poke-card"><div class="dexno">#001</div><img alt="포켓몬 이미지"><div class="poke-name">Loading...</div></div>
        <button class="slide-nav next" aria-label="다음">›</button>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="slideMeta" class="meta">1세대 포켓몬 데이터를 불러오는 중...</div>
      <div class="crudbar">
        <button class="btn btn-yellow" id="addBtn">신규 등록</button>
        <button class="btn btn-primary" id="editBtn">현재 포켓몬 수정</button>
        <button class="btn btn-red" id="deleteBtn">현재 포켓몬 삭제</button>
        <button class="btn btn-ghost" id="refreshBtn">DB 새로고침</button>
      </div>
    </div>

    <aside class="panel market">
      <h2>트레이딩 카드 시세</h2>
      <div class="market-sub">슬라이드 변경 시 최신 카드/시세 데이터를 다시 조회합니다.</div>
      <div class="market-card" id="marketCard">
        <div class="status">카드 정보를 불러오는 중...</div>
      </div>
      <div class="small" style="margin-top:12px">표시 가격은 Pokémon TCG API가 제공하는 TCGplayer/Cardmarket 시장 데이터 기준이며 실제 거래 체결가와 다를 수 있습니다.</div>
    </aside>
  </section>

  <section id="editor" class="panel">
    <h2 id="editorTitle">포켓몬 등록</h2>
    <div class="form-grid">
      <div class="field"><label>도감 번호 (1~151)</label><input id="fNo" type="number" min="1" max="151"></div>
      <div class="field"><label>영문 API 이름</label><input id="fNameEn" placeholder="pikachu"></div>
      <div class="field"><label>표시 이름</label><input id="fDisplay" placeholder="Pikachu"></div>
      <div class="field"><label>이미지 URL</label><input id="fImage" placeholder="https://..."></div>
      <div class="field"><label>타입 1</label><input id="fType1" placeholder="electric"></div>
      <div class="field"><label>타입 2</label><input id="fType2" placeholder=""></div>
      <div class="field full"><label>메모</label><textarea id="fMemo"></textarea></div>
    </div>
    <div class="editor-actions"><button class="btn btn-ghost" id="cancelBtn">취소</button><button class="btn btn-primary" id="saveBtn">저장</button></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://rexjesbszxyjgbnizvof.supabase.co';
const SB_KEY='sb_publishable_QQo2qlO48DyRjVEmgySMFA_nwqvPLwK';
const tableUrl=SB_URL+'/rest/v1/pokemon_catalog';
let pokemon=[], index=0, timer=null, editorMode='add', editId=null, priceCache=new Map(), tickStarted=Date.now();
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
async function sb(path='',options={}){const r=await fetch(tableUrl+path,{...options,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:await r.json()}
async function loadPokemon(keepNo){pokemon=await sb('?select=*&order=pokedex_no.asc');if(!pokemon.length){$('#pokeCard').innerHTML='<b>표시할 포켓몬이 없습니다.</b>';return}if(keepNo){const i=pokemon.findIndex(p=>p.pokedex_no===keepNo);index=i>=0?i:0}else index=Math.min(index,pokemon.length-1);render();startTimer()}
function current(){return pokemon[index]}
function render(){const p=current();if(!p)return;const c=$('#pokeCard');c.innerHTML=`<div class="dexno">#${String(p.pokedex_no).padStart(3,'0')}</div><img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.display_name)}"><div class="poke-name">${escapeHtml(p.display_name)}</div>`;$('#slideMeta').textContent=`${index+1} / ${pokemon.length} · ${[p.type_1,p.type_2].filter(Boolean).join(' / ')||'타입 정보 미입력'}`;localStorage.setItem('selectedPokemonNo',p.pokedex_no);tickStarted=Date.now();fetchMarket(p)}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function next(step=1){if(!pokemon.length)return;index=(index+step+pokemon.length)%pokemon.length;render();startTimer()}
function startTimer(){clearInterval(timer);tickStarted=Date.now();timer=setInterval(()=>next(1),5000)}
setInterval(()=>{const elapsed=(Date.now()-tickStarted)%5000;$('#progressBar').style.width=(elapsed/5000*100)+'%'},100);
$('.prev').onclick=()=>next(-1);$('.next').onclick=()=>next(1);$('#refreshBtn').onclick=()=>loadPokemon(current()?.pokedex_no).then(()=>toast('DB 데이터를 새로 불러왔습니다.'));
function openEditor(mode){editorMode=mode;$('#editor').style.display='block';$('#editor').scrollIntoView({behavior:'smooth'});if(mode==='edit'){const p=current();editId=p.id;$('#editorTitle').textContent='포켓몬 수정';$('#fNo').value=p.pokedex_no;$('#fNameEn').value=p.name_en;$('#fDisplay').value=p.display_name;$('#fImage').value=p.image_url;$('#fType1').value=p.type_1||'';$('#fType2').value=p.type_2||'';$('#fMemo').value=p.memo||''}else{editId=null;$('#editorTitle').textContent='포켓몬 신규 등록';['#fNo','#fNameEn','#fDisplay','#fImage','#fType1','#fType2','#fMemo'].forEach(x=>$(x).value='')}}
$('#addBtn').onclick=()=>openEditor('add');$('#editBtn').onclick=()=>current()&&openEditor('edit');$('#cancelBtn').onclick=()=>$('#editor').style.display='none';
$('#saveBtn').onclick=async()=>{try{const body={pokedex_no:+$('#fNo').value,name_en:$('#fNameEn').value.trim(),display_name:$('#fDisplay').value.trim(),image_url:$('#fImage').value.trim(),type_1:$('#fType1').value.trim()||null,type_2:$('#fType2').value.trim()||null,memo:$('#fMemo').value.trim(),updated_at:new Date().toISOString()};if(!body.pokedex_no||!body.name_en||!body.display_name||!body.image_url)throw new Error('필수 값을 입력하세요.');if(editorMode==='add')await sb('',{method:'POST',body:JSON.stringify(body)});else await sb('?id=eq.'+editId,{method:'PATCH',body:JSON.stringify(body)});$('#editor').style.display='none';await loadPokemon(body.pokedex_no);toast(editorMode==='add'?'등록했습니다.':'수정했습니다.')}catch(e){toast('저장 실패: '+friendly(e.message))}};
$('#deleteBtn').onclick=async()=>{const p=current();if(!p)return;if(!confirm(`#${p.pokedex_no} ${p.display_name} 을(를) DB에서 삭제할까요?`))return;try{await sb('?id=eq.'+p.id,{method:'DELETE'});toast('삭제했습니다.');await loadPokemon()}catch(e){toast('삭제 실패: '+friendly(e.message))}};
function friendly(s){return s.includes('duplicate key')?'도감 번호가 이미 존재합니다.':s.slice(0,110)}
function getMarketPrice(card){const buckets=card.tcgplayer?.prices||{};for(const v of Object.values(buckets)){if(v?.market!=null)return {price:`$${Number(v.market).toFixed(2)}`,label:'TCGplayer market'}}const cm=card.cardmarket?.prices;if(cm?.averageSellPrice!=null)return {price:`€${Number(cm.averageSellPrice).toFixed(2)}`,label:'Cardmarket average'};return null}
async function fetchMarket(p){const box=$('#marketCard');box.innerHTML='<div class="status">실시간 카드 데이터를 조회 중...</div>';if(priceCache.has(p.pokedex_no)){showMarket(priceCache.get(p.pokedex_no),p);return}try{const q=encodeURIComponent(`nationalPokedexNumbers:${p.pokedex_no}`);const url=`https://api.pokemontcg.io/v2/cards?q=${q}&orderBy=-set.releaseDate&pageSize=20`;
const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const card=(j.data||[]).find(c=>getMarketPrice(c))||(j.data||[])[0];if(!card)throw new Error('검색 결과 없음');priceCache.set(p.pokedex_no,card);showMarket(card,p)}catch(e){box.innerHTML=`<div class="status">시세 조회 실패</div><p class="small">${escapeHtml(e.message)}<br>슬라이드가 다시 돌아오면 재시도합니다.</p>`}}
function showMarket(card,p){const price=getMarketPrice(card);$('#marketCard').innerHTML=`<img src="${escapeHtml(card.images?.small||'')}" alt="${escapeHtml(card.name||p.display_name)} 카드"><div style="font-weight:900;margin-top:12px;text-align:center">${escapeHtml(card.name||'Pokémon Card')}</div><div class="price">${price?price.price:'가격 정보 없음'}</div><div class="small">${price?price.label+' · ':''}${escapeHtml(card.set?.name||'세트 정보 없음')}<br>가격 데이터 갱신: ${escapeHtml(card.tcgplayer?.updatedAt||card.cardmarket?.updatedAt||'미표기')}</div>`}
loadPokemon().catch(e=>{$('#slideMeta').textContent='DB 연결 실패: '+friendly(e.message)});
</script>
</body>
</html>
