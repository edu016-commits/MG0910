<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SKY 1945 - Vertical Shooter</title>
<style>
  :root{
    --bg:#08131f;
    --panel:#102233;
    --line:#28445c;
    --text:#edf6ff;
    --sub:#9eb5c9;
    --accent:#ffd54a;
    --danger:#ff5b5b;
    --blue:#59b8ff;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 10%, #17324a 0%, #091724 48%, #050c13 100%);
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  .app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .frame{
    position:relative;
    height:min(96vh, 900px);
    aspect-ratio:9/16;
    max-width:96vw;
    border:3px solid #38566d;
    border-radius:20px;
    overflow:hidden;
    background:#0d283a;
    box-shadow:
      0 0 0 5px rgba(255,255,255,.025),
      0 24px 80px rgba(0,0,0,.45);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:#102b3e;
  }
  .hud{
    position:absolute;
    left:0; right:0; top:0;
    z-index:5;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:start;
    padding:12px 14px;
    pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.65);
  }
  .hud-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .hud-block.right{
    text-align:right;
  }
  .hud-label{
    font-size:10px;
    font-weight:800;
    letter-spacing:1.4px;
    color:#c7d6e4;
  }
  .hud-value{
    font-size:18px;
    font-weight:1000;
    letter-spacing:.5px;
  }
  .stage{
    padding:5px 10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(5,17,28,.46);
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
  }
  .boss-wrap{
    position:absolute;
    z-index:5;
    top:54px;
    left:50%;
    transform:translateX(-50%);
    width:72%;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  .boss-wrap.show{opacity:1}
  .boss-title{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    font-weight:900;
    margin-bottom:4px;
    letter-spacing:1px;
  }
  .boss-bar{
    height:8px;
    background:#07111a;
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;
    overflow:hidden;
  }
  .boss-fill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff765f,#ffca4a);
  }
  .overlay{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px;
    background:
      linear-gradient(rgba(6,17,27,.35),rgba(6,17,27,.78)),
      radial-gradient(circle at 50% 25%, rgba(89,184,255,.18), transparent 34%);
  }
  .overlay.hidden{display:none}
  .panel{
    width:100%;
    padding:28px 20px 22px;
    text-align:center;
    background:rgba(10,28,42,.91);
    border:2px solid #38566d;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
    backdrop-filter:blur(8px);
  }
  .wing{
    font-size:12px;
    color:#a9c4da;
    font-weight:900;
    letter-spacing:4px;
  }
  .title{
    margin:4px 0 4px;
    font-size:43px;
    line-height:1;
    font-weight:1000;
    letter-spacing:-2px;
    color:#fff6cf;
    text-shadow:0 4px 0 #9f5f1f, 0 7px 14px rgba(0,0,0,.5);
  }
  .year{
    margin-bottom:18px;
    font-weight:1000;
    font-size:21px;
    letter-spacing:9px;
    color:#ffcb4c;
  }
  .desc{
    margin:0 auto 18px;
    color:#b8cad8;
    font-size:12px;
    line-height:1.65;
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:14px 0 18px;
  }
  .control-card{
    padding:10px;
    background:#0c1d2b;
    border:1px solid #29465d;
    border-radius:11px;
  }
  .control-card b{
    display:block;
    font-size:11px;
    color:#f2f7fb;
  }
  .control-card span{
    font-size:10px;
    color:#829db2;
  }
  .main-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px 18px;
    background:linear-gradient(#ffde68,#e4aa27);
    color:#1a2024;
    font-weight:1000;
    font-size:15px;
    box-shadow:0 5px 0 #8b5d15;
    cursor:pointer;
  }
  .main-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #8b5d15;
  }
  .small{
    margin-top:12px;
    color:#6f8ca3;
    font-size:9px;
  }
  .mobile-controls{
    position:absolute;
    z-index:12;
    left:0; right:0; bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 14px;
    pointer-events:none;
  }
  .pad,.fire{
    pointer-events:auto;
  }
  .pad{
    width:118px;
    height:118px;
    position:relative;
    opacity:.7;
  }
  .pad button{
    position:absolute;
    width:39px;
    height:39px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(3,16,26,.55);
    color:white;
    font-weight:1000;
    border-radius:10px;
  }
  .up{left:39px;top:0}
  .left{left:0;top:39px}
  .right{right:0;top:39px}
  .down{left:39px;bottom:0}
  .fire{
    width:78px;
    height:78px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.34);
    background:rgba(212,51,51,.68);
    color:#fff;
    font-weight:1000;
    letter-spacing:1px;
    box-shadow:0 5px 0 rgba(91,11,11,.6);
  }
  .fire:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(91,11,11,.6);
  }
  .combo{
    position:absolute;
    z-index:6;
    right:13px;
    top:86px;
    pointer-events:none;
    font-size:12px;
    font-weight:1000;
    color:#ffdc61;
    text-shadow:0 2px 4px #000;
  }
  @media (hover:hover) and (pointer:fine){
    .mobile-controls{opacity:.25}
    .mobile-controls:hover{opacity:.8}
  }
  @media (max-width:480px){
    .app{padding:0}
    .frame{
      width:100vw;
      height:100vh;
      max-width:none;
      border-radius:0;
      border:0;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="frame" id="frame">
    <canvas id="game" width="540" height="960"></canvas>

    <div class="hud">
      <div class="hud-block">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">000000</div>
      </div>
      <div class="stage" id="stage">STAGE 1</div>
      <div class="hud-block right">
        <div class="hud-label">LIFE</div>
        <div class="hud-value" id="life">♥ ♥ ♥</div>
      </div>
    </div>

    <div class="boss-wrap" id="bossWrap">
      <div class="boss-title"><span>ENEMY COMMANDER</span><span id="bossPct">100%</span></div>
      <div class="boss-bar"><div class="boss-fill" id="bossFill"></div></div>
    </div>

    <div class="combo" id="combo"></div>

    <div class="mobile-controls">
      <div class="pad">
        <button class="up" data-key="ArrowUp">▲</button>
        <button class="left" data-key="ArrowLeft">◀</button>
        <button class="right" data-key="ArrowRight">▶</button>
        <button class="down" data-key="ArrowDown">▼</button>
      </div>
      <button class="fire" id="fireBtn">FIRE</button>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <div class="wing">CLASSIC AIR COMBAT</div>
        <div class="title">SKY</div>
        <div class="year">1945</div>
        <p class="desc">
          적 전투기 편대를 돌파하고 지휘관 기체를 격추하세요.<br>
          오리지널 도형 그래픽으로 만든 세로형 아케이드 슈팅게임입니다.
        </p>
        <div class="controls">
          <div class="control-card"><b>이동</b><span>방향키 / WASD</span></div>
          <div class="control-card"><b>공격</b><span>Space / FIRE</span></div>
        </div>
        <button class="main-btn" id="startBtn">MISSION START</button>
        <div class="small">P · 일시정지 / R · 재시작</div>
      </div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <div class="wing" id="endEyebrow">MISSION FAILED</div>
        <div class="title" id="endTitle" style="font-size:34px">GAME OVER</div>
        <div class="year" id="finalScore" style="letter-spacing:2px;font-size:17px">SCORE 000000</div>
        <p class="desc" id="endDesc">적의 방어선을 돌파하지 못했습니다.</p>
        <button class="main-btn" id="restartBtn">RETRY MISSION</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const W = canvas.width;
  const H = canvas.height;

  const scoreEl = document.getElementById('score');
  const lifeEl = document.getElementById('life');
  const stageEl = document.getElementById('stage');
  const comboEl = document.getElementById('combo');

  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const bossWrap = document.getElementById('bossWrap');
  const bossFill = document.getElementById('bossFill');
  const bossPct = document.getElementById('bossPct');

  const finalScoreEl = document.getElementById('finalScore');
  const endEyebrow = document.getElementById('endEyebrow');
  const endTitle = document.getElementById('endTitle');
  const endDesc = document.getElementById('endDesc');

  const keys = {};
  let firingTouch = false;

  let running = false;
  let paused = false;
  let animationId = null;
  let lastTime = 0;

  let score = 0;
  let lives = 3;
  let stage = 1;
  let combo = 0;
  let comboTimer = 0;
  let elapsed = 0;
  let spawnTimer = 0;
  let bossSpawned = false;
  let bossDefeated = false;
  let screenShake = 0;

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let particles = [];
  let powerups = [];
  let clouds = [];
  let stars = [];

  const player = {
    x: W / 2,
    y: H - 160,
    w: 54,
    h: 66,
    speed: 360,
    cooldown: 0,
    fireRate: 0.16,
    invuln: 0,
    power: 1,
    rapid: 0
  };

  function resetGame() {
    score = 0;
    lives = 3;
    stage = 1;
    combo = 0;
    comboTimer = 0;
    elapsed = 0;
    spawnTimer = 0;
    bossSpawned = false;
    bossDefeated = false;
    screenShake = 0;

    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerups = [];

    player.x = W / 2;
    player.y = H - 160;
    player.cooldown = 0;
    player.invuln = 0;
    player.power = 1;
    player.rapid = 0;

    initBackground();
    updateHUD();
    bossWrap.classList.remove('show');
  }

  function initBackground() {
    stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      s: 1 + Math.random() * 2,
      v: 25 + Math.random() * 75,
      a: .25 + Math.random() * .55
    }));

    clouds = Array.from({ length: 8 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      w: 90 + Math.random() * 160,
      v: 12 + Math.random() * 22,
      a: .05 + Math.random() * .07
    }));
  }

  function startGame() {
    resetGame();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    running = true;
    paused = false;
    lastTime = performance.now();
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(loop);
  }

  function endGame(win = false) {
    running = false;
    cancelAnimationFrame(animationId);

    finalScoreEl.textContent = `SCORE ${String(score).padStart(6, '0')}`;

    if (win) {
      endEyebrow.textContent = 'MISSION COMPLETE';
      endTitle.textContent = 'VICTORY';
      endDesc.textContent = '적 지휘관 기체를 격추했습니다. 하늘은 다시 아군의 것입니다.';
      restartBtn.textContent = 'PLAY AGAIN';
    } else {
      endEyebrow.textContent = 'MISSION FAILED';
      endTitle.textContent = 'GAME OVER';
      endDesc.textContent = '적의 방어선을 돌파하지 못했습니다.';
      restartBtn.textContent = 'RETRY MISSION';
    }

    gameOverOverlay.classList.remove('hidden');
  }

  function updateHUD() {
    scoreEl.textContent = String(score).padStart(6, '0');
    lifeEl.textContent = lives > 0 ? Array(lives).fill('♥').join(' ') : '—';
    stageEl.textContent = bossSpawned ? 'BOSS' : `STAGE ${stage}`;

    comboEl.textContent = combo >= 3 ? `COMBO ×${combo}` : '';
  }

  function rectsOverlap(a, b) {
    return (
      a.x - a.w/2 < b.x + b.w/2 &&
      a.x + a.w/2 > b.x - b.w/2 &&
      a.y - a.h/2 < b.y + b.h/2 &&
      a.y + a.h/2 > b.y - b.h/2
    );
  }

  function circleHit(a, b, radius = 12) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy < radius * radius;
  }

  function firePlayer() {
    if (player.cooldown > 0) return;

    const rate = player.rapid > 0 ? 0.09 : player.fireRate;
    player.cooldown = rate;

    if (player.power === 1) {
      bullets.push({ x: player.x, y: player.y - 38, vx: 0, vy: -720, r: 4, damage: 1 });
    } else if (player.power === 2) {
      bullets.push({ x: player.x - 12, y: player.y - 32, vx: -40, vy: -720, r: 4, damage: 1 });
      bullets.push({ x: player.x + 12, y: player.y - 32, vx: 40, vy: -720, r: 4, damage: 1 });
    } else {
      bullets.push({ x: player.x, y: player.y - 40, vx: 0, vy: -760, r: 5, damage: 1 });
      bullets.push({ x: player.x - 16, y: player.y - 28, vx: -120, vy: -700, r: 4, damage: 1 });
      bullets.push({ x: player.x + 16, y: player.y - 28, vx: 120, vy: -700, r: 4, damage: 1 });
    }

    puff(player.x, player.y - 40, '#ffe36d', 4, 60);
  }

  function spawnEnemy(type = 'fighter') {
    if (type === 'fighter') {
      const x = 50 + Math.random() * (W - 100);
      enemies.push({
        type,
        x, y: -60,
        w: 48, h: 56,
        hp: 2 + Math.floor(stage / 2),
        maxHp: 2 + Math.floor(stage / 2),
        speed: 110 + Math.random() * 55 + stage * 8,
        shoot: .7 + Math.random() * 1.2,
        t: Math.random() * 10,
        amp: 20 + Math.random() * 45,
        freq: .8 + Math.random() * .8,
        value: 120
      });
    } else if (type === 'heavy') {
      const x = 70 + Math.random() * (W - 140);
      enemies.push({
        type,
        x, y: -70,
        w: 72, h: 76,
        hp: 10 + stage * 2,
        maxHp: 10 + stage * 2,
        speed: 70 + stage * 5,
        shoot: .4,
        t: 0,
        amp: 0,
        freq: 0,
        value: 450
      });
    }
  }

  function spawnWave() {
    const pattern = Math.floor(Math.random() * 3);

    if (pattern === 0) {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          if (running && !bossSpawned) spawnEnemy('fighter');
        }, i * 180);
      }
    } else if (pattern === 1) {
      spawnEnemy('heavy');
      spawnEnemy('fighter');
      spawnEnemy('fighter');
    } else {
      for (let i = 0; i < 3; i++) spawnEnemy('fighter');
    }
  }

  function spawnBoss() {
    bossSpawned = true;
    bossWrap.classList.add('show');

    enemies = enemies.filter(e => e.type === 'boss');

    enemies.push({
      type: 'boss',
      x: W / 2,
      y: -120,
      targetY: 155,
      w: 164,
      h: 112,
      hp: 240,
      maxHp: 240,
      speed: 80,
      shoot: .25,
      burst: 0,
      dir: 1,
      value: 8000
    });

    updateHUD();
  }

  function enemyShoot(enemy) {
    if (enemy.type === 'fighter') {
      const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
      enemyBullets.push({
        x: enemy.x,
        y: enemy.y + 20,
        vx: Math.cos(angle) * 190,
        vy: Math.sin(angle) * 190,
        r: 5
      });
    }

    if (enemy.type === 'heavy') {
      for (let i = -1; i <= 1; i++) {
        const angle = Math.PI / 2 + i * .24;
        enemyBullets.push({
          x: enemy.x,
          y: enemy.y + 28,
          vx: Math.cos(angle) * 205,
          vy: Math.sin(angle) * 205,
          r: 6
        });
      }
    }

    if (enemy.type === 'boss') {
      for (let i = 0; i < 10; i++) {
        const a = Math.PI / 2 - .95 + (i / 9) * 1.9;
        enemyBullets.push({
          x: enemy.x,
          y: enemy.y + 40,
          vx: Math.cos(a) * 235,
          vy: Math.sin(a) * 235,
          r: 6
        });
      }
    }
  }

  function puff(x, y, color = '#fff', count = 10, speed = 120) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * speed;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: .3 + Math.random() * .5,
        max: .8,
        size: 2 + Math.random() * 5,
        color
      });
    }
  }

  function explode(x, y, large = false) {
    puff(x, y, '#ffd45a', large ? 32 : 16, large ? 260 : 150);
    puff(x, y, '#ff6a45', large ? 22 : 10, large ? 210 : 130);
    screenShake = large ? 12 : 5;
  }

  function maybeDropPowerup(x, y) {
    if (Math.random() < .16) {
      powerups.push({
        x, y,
        w: 26, h: 26,
        type: Math.random() < .68 ? 'power' : 'rapid',
        vy: 110,
        t: 0
      });
    }
  }

  function hurtPlayer() {
    if (player.invuln > 0) return;

    lives--;
    player.invuln = 2.2;
    player.power = Math.max(1, player.power - 1);
    player.rapid = 0;
    combo = 0;
    explode(player.x, player.y, true);
    updateHUD();

    if (lives <= 0) {
      endGame(false);
    }
  }

  function update(dt) {
    elapsed += dt;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    player.cooldown = Math.max(0, player.cooldown - dt);
    player.invuln = Math.max(0, player.invuln - dt);
    player.rapid = Math.max(0, player.rapid - dt);

    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.a || keys.A) dx -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dx += 1;
    if (keys.ArrowUp || keys.w || keys.W) dy -= 1;
    if (keys.ArrowDown || keys.s || keys.S) dy += 1;

    const mag = Math.hypot(dx, dy) || 1;
    dx /= mag;
    dy /= mag;

    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;

    player.x = Math.max(30, Math.min(W - 30, player.x));
    player.y = Math.max(90, Math.min(H - 55, player.y));

    if (keys[' '] || firingTouch) firePlayer();

    stars.forEach(s => {
      s.y += s.v * dt;
      if (s.y > H) {
        s.y = -4;
        s.x = Math.random() * W;
      }
    });

    clouds.forEach(c => {
      c.y += c.v * dt;
      if (c.y - c.w > H) {
        c.y = -c.w;
        c.x = Math.random() * W;
      }
    });

    if (!bossSpawned) {
      spawnTimer -= dt;

      if (spawnTimer <= 0) {
        spawnWave();
        spawnTimer = Math.max(.85, 2.35 - stage * .18);
      }

      if (elapsed > 20 && stage === 1) {
        stage = 2;
        updateHUD();
      }

      if (elapsed > 40 && stage === 2) {
        stage = 3;
        updateHUD();
      }

      if (elapsed > 57) {
        spawnBoss();
      }
    }

    bullets.forEach(b => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    });

    enemyBullets.forEach(b => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    });

    enemies.forEach(e => {
      if (e.type === 'fighter') {
        e.t += dt;
        e.y += e.speed * dt;
        e.x += Math.sin(e.t * e.freq * 3) * e.amp * dt;
      } else if (e.type === 'heavy') {
        e.y += e.speed * dt;
      } else if (e.type === 'boss') {
        if (e.y < e.targetY) {
          e.y += e.speed * dt;
        } else {
          e.x += e.dir * 90 * dt;
          if (e.x > W - 105) e.dir = -1;
          if (e.x < 105) e.dir = 1;
        }
      }

      e.shoot -= dt;

      if (e.shoot <= 0 && e.y > 0) {
        enemyShoot(e);

        if (e.type === 'boss') e.shoot = .78;
        else if (e.type === 'heavy') e.shoot = 1.15;
        else e.shoot = 1.45 + Math.random() * .9;
      }
    });

    powerups.forEach(p => {
      p.t += dt;
      p.y += p.vy * dt;
      p.x += Math.sin(p.t * 4) * 35 * dt;
    });

    particles.forEach(p => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .985;
      p.vy *= .985;
      p.life -= dt;
    });

    // Player bullets vs enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];

        if (
          b.x > e.x - e.w/2 &&
          b.x < e.x + e.w/2 &&
          b.y > e.y - e.h/2 &&
          b.y < e.y + e.h/2
        ) {
          e.hp -= b.damage;
          bullets.splice(i, 1);
          hit = true;
          puff(b.x, b.y, '#fff1a1', 3, 40);

          if (e.type === 'boss') {
            const pct = Math.max(0, e.hp / e.maxHp * 100);
            bossFill.style.width = `${pct}%`;
            bossPct.textContent = `${Math.ceil(pct)}%`;
          }

          if (e.hp <= 0) {
            score += e.value + combo * 15;
            combo++;
            comboTimer = 2.2;
            explode(e.x, e.y, e.type === 'boss');
            maybeDropPowerup(e.x, e.y);

            if (e.type === 'boss') {
              bossDefeated = true;
              bossWrap.classList.remove('show');
              enemies.splice(j, 1);
              updateHUD();
              setTimeout(() => endGame(true), 850);
              return;
            }

            enemies.splice(j, 1);
            updateHUD();
          }
          break;
        }
      }

      if (hit) continue;
    }

    // Enemy bullets vs player
    if (player.invuln <= 0) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (circleHit(b, player, 24)) {
          enemyBullets.splice(i, 1);
          hurtPlayer();
          break;
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (rectsOverlap(
          {x:player.x,y:player.y,w:34,h:46},
          {x:e.x,y:e.y,w:e.w*.72,h:e.h*.72}
        )) {
          if (e.type !== 'boss') {
            explode(e.x, e.y);
            enemies.splice(i, 1);
          }
          hurtPlayer();
          break;
        }
      }
    }

    // Pickups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];

      if (rectsOverlap(
        {x:player.x,y:player.y,w:44,h:56},
        {x:p.x,y:p.y,w:p.w,h:p.h}
      )) {
        if (p.type === 'power') {
          player.power = Math.min(3, player.power + 1);
          score += 500;
        } else {
          player.rapid = 8;
          score += 350;
        }

        puff(p.x, p.y, p.type === 'power' ? '#64d2ff' : '#ffdf55', 18, 130);
        powerups.splice(i, 1);
        updateHUD();
      }
    }

    bullets = bullets.filter(b => b.y > -40 && b.x > -40 && b.x < W + 40);
    enemyBullets = enemyBullets.filter(b => b.y < H + 50 && b.x > -50 && b.x < W + 50);
    enemies = enemies.filter(e => e.y < H + 120);
    powerups = powerups.filter(p => p.y < H + 40);
    particles = particles.filter(p => p.life > 0);

    screenShake *= .82;
    updateHUD();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#153e55');
    g.addColorStop(.55, '#0e2f45');
    g.addColorStop(1, '#0b2538');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // ocean / terrain stripes
    ctx.globalAlpha = .12;
    ctx.strokeStyle = '#7ad1ea';
    ctx.lineWidth = 1;
    for (let y = 120; y < H; y += 80) {
      ctx.beginPath();
      ctx.moveTo(0, (y + elapsed * 34) % H);
      ctx.lineTo(W, (y + elapsed * 34) % H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    stars.forEach(s => {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#d8f2ff';
      ctx.fillRect(s.x, s.y, s.s, s.s * 3.2);
    });
    ctx.globalAlpha = 1;

    clouds.forEach(c => {
      ctx.save();
      ctx.globalAlpha = c.a;
      ctx.fillStyle = '#e8f6ff';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w*.36, c.w*.12, 0, 0, Math.PI*2);
      ctx.ellipse(c.x+c.w*.18, c.y+10, c.w*.28, c.w*.1, 0, 0, Math.PI*2);
      ctx.ellipse(c.x-c.w*.17, c.y+7, c.w*.25, c.w*.09, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) return;

    const x = player.x;
    const y = player.y;

    ctx.save();
    ctx.translate(x, y);

    // shadow
    ctx.globalAlpha = .25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(3, 14, 35, 18, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // wing
    ctx.fillStyle = '#b7c6cf';
    ctx.beginPath();
    ctx.moveTo(-8, -10);
    ctx.lineTo(-30, 19);
    ctx.lineTo(-49, 26);
    ctx.lineTo(-42, 10);
    ctx.lineTo(-18, -4);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(8, -10);
    ctx.lineTo(30, 19);
    ctx.lineTo(49, 26);
    ctx.lineTo(42, 10);
    ctx.lineTo(18, -4);
    ctx.closePath();
    ctx.fill();

    // fuselage
    ctx.fillStyle = '#e8eef2';
    ctx.beginPath();
    ctx.moveTo(0, -38);
    ctx.lineTo(13, -5);
    ctx.lineTo(9, 34);
    ctx.lineTo(0, 42);
    ctx.lineTo(-9, 34);
    ctx.lineTo(-13, -5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#355f7b';
    ctx.fillRect(-4, -14, 8, 25);

    ctx.fillStyle = '#ffbf3d';
    ctx.beginPath();
    ctx.moveTo(0, -34);
    ctx.lineTo(4, -19);
    ctx.lineTo(-4, -19);
    ctx.closePath();
    ctx.fill();

    // propeller
    ctx.strokeStyle = 'rgba(230,244,255,.55)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-25, -35);
    ctx.lineTo(25, -35);
    ctx.stroke();

    // exhaust
    ctx.globalAlpha = .8;
    ctx.fillStyle = '#62c8ff';
    ctx.beginPath();
    ctx.moveTo(-5, 38);
    ctx.lineTo(0, 53 + Math.random()*8);
    ctx.lineTo(5, 38);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'fighter') {
      ctx.fillStyle = '#c94f4a';
      ctx.beginPath();
      ctx.moveTo(0, 30);
      ctx.lineTo(-9, 8);
      ctx.lineTo(-36, -17);
      ctx.lineTo(-18, -22);
      ctx.lineTo(-6, -12);
      ctx.lineTo(0, -30);
      ctx.lineTo(6, -12);
      ctx.lineTo(18, -22);
      ctx.lineTo(36, -17);
      ctx.lineTo(9, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f3d59b';
      ctx.fillRect(-4, -8, 8, 19);
    }

    if (e.type === 'heavy') {
      ctx.fillStyle = '#896d43';
      ctx.beginPath();
      ctx.moveTo(0, 38);
      ctx.lineTo(-12, 15);
      ctx.lineTo(-44, 10);
      ctx.lineTo(-39, -18);
      ctx.lineTo(-15, -10);
      ctx.lineTo(-9, -35);
      ctx.lineTo(9, -35);
      ctx.lineTo(15, -10);
      ctx.lineTo(39, -18);
      ctx.lineTo(44, 10);
      ctx.lineTo(12, 15);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#2b3438';
      ctx.fillRect(-7, -16, 14, 28);
    }

    if (e.type === 'boss') {
      ctx.fillStyle = '#5b6267';
      ctx.beginPath();
      ctx.moveTo(0, 56);
      ctx.lineTo(-20, 26);
      ctx.lineTo(-78, 37);
      ctx.lineTo(-91, 8);
      ctx.lineTo(-46, -18);
      ctx.lineTo(-23, -8);
      ctx.lineTo(-16, -46);
      ctx.lineTo(16, -46);
      ctx.lineTo(23, -8);
      ctx.lineTo(46, -18);
      ctx.lineTo(91, 8);
      ctx.lineTo(78, 37);
      ctx.lineTo(20, 26);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#9e2f32';
      ctx.fillRect(-10, -29, 20, 55);

      ctx.fillStyle = '#d9b85a';
      ctx.beginPath();
      ctx.arc(-52, 7, 10, 0, Math.PI*2);
      ctx.arc(52, 7, 10, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawBullets() {
    bullets.forEach(b => {
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#fff5a4';
      ctx.fillStyle = '#fff5a4';
      ctx.fillRect(b.x - 2, b.y - 12, 4, 20);
      ctx.restore();
    });

    enemyBullets.forEach(b => {
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff5d4c';
      ctx.fillStyle = '#ff6a59';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawPowerups() {
    powerups.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.t * 2.6);

      ctx.fillStyle = p.type === 'power' ? '#48bfff' : '#ffd84d';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.rotate(-p.t * 2.6);
      ctx.fillStyle = '#102030';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.type === 'power' ? 'P' : 'R', 0, 1);
      ctx.restore();
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawPause() {
    if (!paused) return;
    ctx.fillStyle = 'rgba(3,10,16,.52)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '900 42px system-ui';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '600 15px system-ui';
    ctx.fillStyle = '#bad0df';
    ctx.fillText('P 키를 눌러 계속', W/2, H/2 + 32);
  }

  function draw() {
    ctx.save();

    if (screenShake > .5) {
      ctx.translate(
        (Math.random() - .5) * screenShake,
        (Math.random() - .5) * screenShake
      );
    }

    drawBackground();
    drawPowerups();
    enemies.forEach(drawEnemy);
    drawBullets();
    drawPlayer();
    drawParticles();

    ctx.restore();
    drawPause();
  }

  function loop(now) {
    if (!running) return;

    const dt = Math.min(.033, (now - lastTime) / 1000);
    lastTime = now;

    if (!paused) update(dt);
    draw();

    animationId = requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
      e.preventDefault();
    }

    keys[e.key] = true;

    if ((e.key === 'p' || e.key === 'P') && running) {
      paused = !paused;
    }

    if ((e.key === 'r' || e.key === 'R') && !startOverlay.classList.contains('hidden')) {
      startGame();
    }
  }, { passive:false });

  window.addEventListener('keyup', e => {
    keys[e.key] = false;
  });

  document.querySelectorAll('[data-key]').forEach(btn => {
    const key = btn.dataset.key;

    const on = e => {
      e.preventDefault();
      keys[key] = true;
    };

    const off = e => {
      e.preventDefault();
      keys[key] = false;
    };

    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('pointerleave', off);
  });

  const fireBtn = document.getElementById('fireBtn');

  fireBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    firingTouch = true;
  });

  ['pointerup','pointercancel','pointerleave'].forEach(ev => {
    fireBtn.addEventListener(ev, e => {
      e.preventDefault();
      firingTouch = false;
    });
  });

  // Canvas drag movement on mobile
  let dragging = false;

  canvas.addEventListener('pointerdown', e => {
    if (!running || paused) return;
    dragging = true;
    movePlayerToPointer(e);
  });

  canvas.addEventListener('pointermove', e => {
    if (!dragging || !running || paused) return;
    movePlayerToPointer(e);
  });

  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointercancel', () => dragging = false);

  function movePlayerToPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width;
    const sy = H / rect.height;
    player.x = (e.clientX - rect.left) * sx;
    player.y = (e.clientY - rect.top) * sy;
    player.x = Math.max(30, Math.min(W - 30, player.x));
    player.y = Math.max(90, Math.min(H - 55, player.y));
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  initBackground();
  draw();
})();
</script>
</body>
</html>
